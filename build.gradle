// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        // Kotlin e Android
        kotlin_version = '1.9.24'
        gradle_version = '8.6.0'

        //Compose
        compose_version = '1.6.0'
        compose_activity = '1.8.0'
        compose_material = '1.2.1'
        compose_viewmodel = '2.7.0'
        compose_coil = '2.6.0'

        // AndroidX
        appcompat_version = '1.6.1'
        core_ktx_version = '1.12.0'
        constraintlayout_version = '2.1.4'
        material_version = "1.11.0"
        lifecycle_version = "2.7.0"
        room_version = "2.6.1"

        // Redes e Imagens
        retrofit_version = '2.9.0'
        okhttp_version = '4.12.0'
        logging_interceptor_version = "4.12.0"
        picasso_version = '2.8'
        circleimageview_version = '3.1.0'
        gson_version = '2.10.1'

        // DI
        koin_version = "3.5.3"
        dagger_version = "2.51"

        // Concorrência
        coroutines_version = "1.8.0"
        rxjava_version = "3.1.8"
        rxandroid_version = "3.0.2"

        // Testes Unitários
        junit_version = '4.13.2'
        mockito_version = '5.10.0'
        mockito_kotlin_version = '2.2.0'
        mockk_version = "1.13.10"
        core_testing_version = '2.2.0'

        // Testes de UI/Instrumentação
        androidx_junit_version = '1.1.5'
        androidx_test_core_version = '1.5.0'
        espresso_version = '3.5.1'
    }

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$gradle_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}